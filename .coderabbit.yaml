# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    base_branches:
      - main
    ignore_title_keywords:
      - WIP
      - "[skip review]"
  path_filters:
    - "!**/.venv/**"
    - "!**/__pycache__/**"
    - "!**/.pytest_cache/**"
    - "!**/.ruff_cache/**"
  path_instructions:
    - path: "app/**/*.py"
      instructions: |
        Review FastAPI endpoints for input validation, clear error handling, and accidental exposure of secrets.
        Keep business logic out of route handlers and flag blocking I/O in async endpoints.
    - path: "tests/**/*.py"
      instructions: |
        Check that tests are deterministic, use descriptive names, and cover success and failure behavior where applicable.
    - path: "db/migration/**/*.sql"
      instructions: |
        Check migration safety, forward compatibility, and whether the migration can be applied to an existing database.

