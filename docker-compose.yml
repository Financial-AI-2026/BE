services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-financial_ai}
      POSTGRES_USER: ${POSTGRES_USER:-financial_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-financial_ai_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  flyway:
    image: flyway/flyway:11
    depends_on:
      db:
        condition: service_healthy
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-financial_ai}
      FLYWAY_USER: ${POSTGRES_USER:-financial_ai}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-financial_ai_local}
    volumes:
      - ./db/migration:/flyway/sql:ro
      - ./flyway.toml:/flyway/conf/flyway.toml:ro

volumes:
  postgres_data:

